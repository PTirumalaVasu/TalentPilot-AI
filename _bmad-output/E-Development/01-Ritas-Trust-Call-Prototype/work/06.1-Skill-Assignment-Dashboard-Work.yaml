metadata:
  page_number: "06.1"
  page_name: "Skill Assignment Dashboard"
  scenario: "06-Ritas-Pulse-Check"
  complexity: "medium"
  estimated_sections: 7
  estimated_time: "140 minutes"

  device_compatibility:
    type: "desktop-only"
    primary_viewport: "1440px"
    test_viewports:
      - width: 1280
        height: 800
        device: "Desktop (minimum)"
      - width: 1440
        height: 900
        device: "Desktop (laptop common)"
      - width: 1920
        height: 1080
        device: "Desktop (external monitor)"
    breakpoints: []
    touch_optimized: false
    hover_interactions: true

  dependencies:
    - "shared/prototype-api.js"
    - "shared/init.js"
    - "shared/utils.js"
    - "shared/auth.js"

design_tokens:
  colors:
    primary: "#2563eb"
    on_track: "#16a34a"
    in_progress: "#f59e0b"
    needs_attention: "#dc2626"
  tailwind_config:
    theme_extend:
      colors:
        "talentpilot":
          50: "#eff6ff"
          100: "#dbeafe"
          500: "#2563eb"
          600: "#1d4ed8"
          700: "#1e40af"
      fontFamily:
        sans: "['Inter', 'system-ui', 'sans-serif']"

page_purpose: |
  Give Rita an org-wide readiness temperature check the moment she logs in.
  The page's real job (per D1/D2 discussion) is narrower than "show stats":
  get Rita to the specific employees who need her, fast. Stats and the
  progress ring are secondary context; Employee Segmentation is primary.

user_context:
  - "Rita logs in at her desk, start of her workday, before any specific staffing question has come in"
  - "Hoping things are basically fine; worried a clean-looking summary hides real problems"
  - "Dashboard nav entry now opens here first, not the full row grid (01.1)"

success_criteria:
  - "Stats, ring, and segmentation are computed from data (employees + assignments), never hardcoded"
  - "Needs Attention segment is genuinely non-clickable when count is 0, not just visually muted"
  - "Needs Attention popover lists only the actually-flagged employees, from real data"
  - "Loading/Empty/Error are real states driven by data conditions, not a debug-only URL toggle"
  - "Left nav shows the current 4-link version (Dashboard/Skill Assignments/Skills/Employees)"

demo_data_needed:
  source: "../data/demo-data.js (window.DEMO_DATA)"
  approach: >
    ADDITIVE ONLY — do not modify the 4 existing employees or 6 existing
    assignments Scenario 01 already built and tested against (that data is
    "complete"/approved per work/Skills-Dashboard-Work.yaml). Add 3 new
    employees + 5 new assignments, correctly modeled on the CURRENT
    Status/Provenance split (Status derived from watchPercent; Provenance is
    an independent field, including a genuine "Needs Attention" value) so
    this page has a realistic, non-empty Needs Attention case to demonstrate
    without touching already-approved data. Existing employees end up
    distributed across On Track/In Progress by the same computed rule
    (none currently carry provenance "Needs Attention").
  new_employees:
    - { id: "emp-alex", firstName: "Alex", lastName: "Kim" }
    - { id: "emp-taylor", firstName: "Taylor", lastName: "Singh" }
    - { id: "emp-riley", firstName: "Riley", lastName: "Brooks" }
  new_assignments_summary: >
    Alex: 2 assignments, both Verified/Completed (100%) -> On Track.
    Taylor: 2 assignments, In Progress, no Needs Attention -> In Progress bucket.
    Riley: 1 assignment, provenance "Needs Attention" (stale self-reported,
    15 days) -> Needs Attention bucket, the only flagged employee in the demo.
  known_pre_existing_bug_not_fixed_here: >
    assign-004 (Sam) has status:"Needs Attention" as a STATUS value with
    provenance:"Self-reported" — this is exactly the Status/Provenance
    conflation the real architecture (AD-3) already flagged and corrected.
    Left as-is (not fixed) to avoid changing already-approved Scenario 01
    behavior as a side effect of this unrelated page build. Segmentation
    logic reads `provenance` only, so this does not cause a false positive.

computed_constants:
  ON_TRACK_THRESHOLD: 0.8   # PRD Open Question 20 — PM default, not user-confirmed

