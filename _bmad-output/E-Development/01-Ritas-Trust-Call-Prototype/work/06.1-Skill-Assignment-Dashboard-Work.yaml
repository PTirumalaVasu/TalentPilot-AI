# ============================================================================
# SECTION BREAKDOWN
# ============================================================================

sections:
  - id: "section-1"
    name: "Page Structure & Shared Shell"
    scope: "HTML skeleton, 4-link left nav (Dashboard active), top bar user menu, page heading"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: []
    object_ids: ["app-nav-sidebar", "app-nav-logo", "app-nav-link-dashboard", "app-nav-link-skill-assignments", "app-nav-link-skills", "app-nav-link-employees", "app-topbar-user-menu", "dashboard-heading-title", "dashboard-heading-subtitle"]
    acceptance_criteria:
      - "Nav shows all 4 links; Dashboard is visually active (bg highlight, not color-only — also has aria-current)"
      - "Skill Assignments/Skills/Employees links navigate to 01.1/04.1/05.1 respectively"
      - "User menu opens/closes, Sign Out present"

  - id: "section-2"
    name: "Top-line Stats Row (data-driven)"
    scope: "Total Employees / Total Skills Assigned / Total Completed, computed from PrototypeAPI data"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-1"]
    object_ids: ["dashboard-stat-employees", "dashboard-stat-skills-assigned", "dashboard-stat-completed"]
    acceptance_criteria:
      - "Total Employees = employees.length (7 with the additive demo data)"
      - "Total Skills Assigned = assignments.length (11)"
      - "Total Completed = count of assignments with computed Status === 'Completed' (3)"

  - id: "section-3"
    name: "Assignment Progress Ring (data-driven)"
    scope: "Donut ring (conic-gradient) + Completed/In Progress/Not Started legend + Overall %"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-2"]
    object_ids: ["dashboard-progress-card", "dashboard-progress-heading", "dashboard-progress-ring", "dashboard-progress-legend-completed", "dashboard-progress-legend-inprogress", "dashboard-progress-legend-notstarted"]
    acceptance_criteria:
      - "Ring's conic-gradient stops match computed Completed/In Progress/Not Started proportions"
      - "Overall % = round(completed / total * 100)"
      - "Legend counts match the ring visually"

  - id: "section-4"
    name: "Employee Segmentation (data-driven, incl. On-Track threshold)"
    scope: "Pie chart + On Track/In Progress/Needs Attention legend, per-employee aggregation"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-2"]
    object_ids: ["dashboard-segmentation-card", "dashboard-segmentation-heading", "dashboard-segmentation-pie", "dashboard-segmentation-legend-ontrack", "dashboard-segmentation-legend-inprogress"]
    acceptance_criteria:
      - "Per-employee classification: Needs Attention (>=1 assignment w/ provenance Needs Attention, priority) > On Track (0 Needs Attention AND completion >= ON_TRACK_THRESHOLD) > In Progress (everything else)"
      - "Employees with zero assignments excluded from the denominator entirely"
      - "Pie chart conic-gradient matches computed segment proportions"
      - "Segmentation heading visually larger than Progress Ring heading (hierarchy)"

  - id: "section-5"
    name: "Needs Attention Popover (real data, disabled-when-zero)"
    scope: "Clickable segment (only when count > 0) opening a popover of real flagged employees"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-4"]
    object_ids: ["dashboard-segmentation-legend-needsattention", "dashboard-segmentation-hint", "dashboard-needs-attention-popover", "dashboard-needs-attention-popover-item"]
    acceptance_criteria:
      - "When Needs Attention count is 0: segment renders as plain text, not a <button>, no hint text, no popover markup at all"
      - "When count > 0: segment is a real <button> with aria-label, opens popover listing each flagged employee + their flagged skill"
      - "Popover closes on outside click, Escape, or navigating away"
      - "Each popover row links to 01.1 filtered to that employee (?employee={id})"

  - id: "section-6"
    name: "Page-Level Loading / Empty / Error States (data-driven)"
    scope: "Real states, not the prior mock's ?demo_state= URL-only toggle"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-2", "section-3", "section-4", "section-5"]
    object_ids: []
    acceptance_criteria:
      - "Loading state shows briefly on real (simulated-async) page load before data renders"
      - "Empty state renders when employees.length === 0 or assignments.length === 0 (simulated via ?demo_state=empty for testing, since seed data always has content)"
      - "Error state renders on a simulated fetch failure (?demo_state=error) with a working Retry"
      - "?demo_state= remains as a TESTING convenience only (documented as a migration_todo to remove), not the state's actual trigger condition"

  - id: "section-7"
    name: "Interactions & Polish"
    scope: "Keyboard operability, aria-labels, active-nav indication, dev-mode overlay"
    files_affected: ["06.1-Skill-Assignment-Dashboard.html"]
    dependencies: ["section-1", "section-2", "section-3", "section-4", "section-5", "section-6"]
    object_ids: []
    acceptance_criteria:
      - "Tab reaches the Needs Attention button and popover links in visual order"
      - "Escape closes the popover and returns focus to the trigger button"
      - "Dashboard nav link has aria-current='page'"
      - "Dev-mode Shift+Click still works for Object ID copy"

# ============================================================================
# JAVASCRIPT REQUIREMENTS
# ============================================================================

javascript_functions:
  initialization:
    - "initPage() - loads employees+assignments, computes all derived data, renders"
  computation:
    - "computeAssignmentStatus(watchPercent) -> 'Not Started' | 'In Progress' | 'Completed'"
    - "computeEmployeeSegment(employeeAssignments, ON_TRACK_THRESHOLD) -> 'onTrack' | 'inProgress' | 'needsAttention'"
  ui_interactions:
    - "toggleNeedsAttentionPopover()"
    - "toggleUserMenu()"
  feedback:
    - "setDashboardState('loading' | 'loaded' | 'empty' | 'error')"

# ============================================================================
# TESTING CHECKLIST
# ============================================================================

testing_checklist:
  functionality:
    - "[ ] Stats/ring/segmentation all computed from data, no hardcoded numbers remain"
    - "[ ] Needs Attention popover shows exactly the flagged employees (Riley, in the additive demo data)"
    - "[ ] Needs Attention segment is non-clickable and shows no hint when count is 0 (verify by temporarily zeroing test data)"
    - "[ ] Existing Scenario 01 data (Casey/Morgan/Jordan/Sam) unmodified — 01.1 still renders identically to before this session"
  code_quality:
    - "[ ] All Object IDs present"
    - "[ ] No console errors"
    - "[ ] div-tag balance and inline-JS syntax statically verified (node --check) — no live browser tool in this environment"
  accessibility:
    - "[ ] Needs Attention button has aria-label with live count"
    - "[ ] Popover keyboard-operable, Escape closes and returns focus"
    - "[ ] Pie/ring segments paired with text, never color-only"

# ============================================================================
# MIGRATION NOTES
# ============================================================================

migration_todos:
  - "Replace client-side aggregation (computeEmployeeSegment etc.) with a real backend read-composition endpoint per the addendum's Architecture Handoff Notes"
  - "ON_TRACK_THRESHOLD (0.8) is a named constant here specifically because PRD Open Question 20 flags it as unconfirmed — surface it as a real config value in production, not a hardcoded literal"
  - "Remove the ?demo_state= URL param mechanism once real fetch success/error/empty conditions drive the UI"

