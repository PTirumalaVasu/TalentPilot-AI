# ============================================================================
# TESTING CHECKLIST (after all sections complete)
# ============================================================================

testing_checklist:
  functionality:
    - "[ ] Create Employee: required-field validation works"
    - "[ ] Create Employee: duplicate ID/Email detection works"
    - "[ ] Password Reveal: title is conditional (created vs. regenerated)"
    - "[ ] Password Reveal: copy-to-clipboard works"
    - "[ ] Edit: ID/Code is read-only; other fields save correctly"
    - "[ ] Regenerate: invalidates old password conceptually (new value shown, mock has no real auth to invalidate)"
    - "[ ] Delete/Archive: branches correctly on hasAssignments"
    - "[ ] Search/filter/archived-toggle/view-toggle all work together without resetting each other"
    - "[ ] Pagination works at 15/page"

  responsive_testing:
    - "[ ] 375px: no horizontal scroll, nav reachable via hamburger"
    - "[ ] 768px: breakpoint transition is clean"
    - "[ ] 1024px/1280px: table remains usable, no cramped columns"
    - "[ ] 1440px: matches the base spec exactly"

  code_quality:
    - "[ ] All Object IDs from the spec are present as data-object-id attributes"
    - "[ ] No console errors through the full sunshine path"
    - "[ ] Tailwind classes match the talentpilot palette, not ad hoc colors"

  accessibility:
    - "[ ] Keyboard navigation works through nav, toolbar, table/card actions, and all modals"
    - "[ ] All icon-only buttons carry aria-labels"
    - "[ ] Status badges are never color-only"

