# ============================================================================
# SECTION BREAKDOWN (implementation order — as approved)
# ============================================================================

sections:
  - id: "section-1"
    name: "Left Nav Pane + Top Bar"
    scope: "New shared shell (FR-29): fixed left sidebar (logo, Dashboard/Skills/Employees links, Employees active), slim top bar with user menu only"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: ["shared/auth.js"]
    object_ids: ["app-nav-sidebar", "app-nav-logo", "app-nav-link-dashboard", "app-nav-link-skills", "app-nav-link-employees", "app-topbar-user-menu"]
    tailwind_classes:
      - "Sidebar: w-56 (desktop), bg-white, border-r, flex flex-col"
      - "Active link: bg-talentpilot-50, text-talentpilot-700, font-medium"
      - "Top bar: bg-white, border-b, px-6, py-3, flex justify-end"
    acceptance_criteria:
      - "Sidebar shows all 3 links with Employees visually active"
      - "Top bar shows only the user menu, no nav links"
      - "requireRole('HR') gate redirects to login.html when unauthenticated"
    placeholder_message: "🚧 Building the navigation shell..."

  - id: "section-2"
    name: "Toolbar + Table/Card view + pagination"
    scope: "Page heading, summary count, search/filters/archived-toggle, view toggle, table view (default) with 5 preseeded employees, card view (toggle), 15/page pagination"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: ["data/demo-data.js"]
    object_ids: ["employees-tab-heading-title", "employees-tab-summary-count", "employees-tab-search-input", "employees-tab-filter-department", "employees-tab-filter-position", "employees-tab-toggle-archived", "employees-tab-view-toggle", "employees-tab-btn-new-employee", "employees-table", "employees-grid", "employees-table-pagination"]
    tailwind_classes:
      - "Table: w-full, bg-white, border, rounded-lg"
      - "Card grid: grid-cols-1 md:grid-cols-2 xl:grid-cols-3, gap-4"
    acceptance_criteria:
      - "Table is the default view; toggling to Card view preserves search/filter/page state"
      - "Search, Department filter, Position filter, and Show Archived all filter the list correctly"
      - "Pagination shows 15 records/page (moot with 4 seed employees, but the control renders and is exercised via a quick synthetic 20-employee test during acceptance testing)"
    placeholder_message: "🚧 Building the roster list..."

  - id: "section-3"
    name: "Create Employee Panel"
    scope: "Modal with 11 fields (3 required), inline duplicate-notice, submit handler"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: []
    object_ids: ["create-emp-id", "create-emp-name", "create-emp-email", "create-emp-position", "create-emp-department", "create-emp-phone", "create-emp-location", "create-emp-manager", "create-emp-project", "create-emp-technologies", "create-emp-experience", "create-emp-duplicate-notice", "create-employee-btn-submit"]
    tailwind_classes:
      - "Modal: fixed inset-0, bg-black/40, max-w-lg"
      - "Grid: grid-cols-2 gap-3 for the field layout"
    acceptance_criteria:
      - "Submitting with ID/Name/Email blank shows the required-fields notice"
      - "Submitting a duplicate ID or Email (against Taylor Brooks or the preseeded roster) shows the duplicate notice"
      - "Valid submit closes this modal and opens Password Reveal"
    placeholder_message: "🚧 Building the Create Employee form..."

  - id: "section-4"
    name: "Password Reveal Panel"
    scope: "One-time password display, copy-to-clipboard, recovery note pointing to Regenerate — shared between Create and Regenerate flows"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: []
    object_ids: ["password-reveal-title", "password-reveal-summary", "password-reveal-value", "password-reveal-btn-copy", "password-reveal-recovery-note", "password-reveal-btn-done"]
    tailwind_classes:
      - "Password field: font-mono, bg-gray-50, border, rounded-lg"
    acceptance_criteria:
      - "Title reads 'Employee created' when opened via Create, 'Password regenerated' when opened via Regenerate — FIXES the Phase 4 mock's hardcoded-title gap (see PROTOTYPE-ROADMAP.md Backlog #1)"
      - "Copy button copies the exact displayed password and shows a toast"
      - "Done closes the modal and returns to the roster with the new/updated record visible"
    placeholder_message: "🚧 Building the password reveal..."

  - id: "section-5"
    name: "Edit Employee Panel"
    scope: "Edit modal, all fields except Employee ID/Code (read-only)"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: []
    object_ids: ["edit-employee-id-readonly", "edit-employee-fields", "edit-employee-btn-save"]
    tailwind_classes:
      - "Read-only field: bg-gray-50, text-gray-500, border-gray-200"
    acceptance_criteria:
      - "Employee ID/Code renders read-only, never editable"
      - "Saving updates the roster row/card in place without a full page reload"
    placeholder_message: "🚧 Building Edit Employee..."

  - id: "section-6"
    name: "Regenerate Password + Delete/Archive Confirmations"
    scope: "Regenerate confirmation (hands off to section 4's modal), Delete/Archive confirmation with server-decided branching copy"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: []
    object_ids: ["regen-password-heading", "regen-password-summary", "regen-password-btn-confirm", "delete-employee-heading", "delete-employee-summary-hard", "delete-employee-summary-archive", "delete-employee-btn-confirm"]
    tailwind_classes:
      - "Confirm button (delete): bg-red-600, hover:bg-red-700"
      - "Confirm button (regenerate): bg-talentpilot-600"
    acceptance_criteria:
      - "An Employee with hasAssignments=true shows the archive copy and 'Archive Employee' button label"
      - "An Employee with hasAssignments=false shows the hard-delete copy and 'Remove Employee' button label"
      - "Confirming archive keeps the record (status → Archived); confirming hard-delete removes it from the demo data array"
    placeholder_message: "🚧 Building Regenerate + Delete/Archive..."

  - id: "section-7"
    name: "Responsive states"
    scope: "Left nav collapses to a hamburger/icon rail below 768px; table view becomes horizontally scrollable or auto-switches to card view below 1024px; toolbar wraps sensibly at tablet width"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: []
    object_ids: []
    tailwind_classes:
      - "Sidebar: hidden md:flex, plus a mobile hamburger trigger below 768px"
      - "Toolbar: flex-wrap for tablet/mobile"
    acceptance_criteria:
      - "375px, 768px, 1280px, 1440px viewports all render without horizontal scroll on the page shell"
      - "Left nav is reachable (hamburger toggle) below 768px, not simply hidden with no alternative"
    placeholder_message: "🚧 Building responsive behavior..."

  - id: "section-8"
    name: "Dev Mode Integration + polish"
    scope: "Dev mode toggle wiring (matches 01.1/04.1), final visual pass, toast component, console log cleanup"
    files_affected: ["05.1-Employees-Tab.html"]
    dependencies: ["components/dev-mode.js", "components/dev-mode.css"]
    object_ids: []
    tailwind_classes: []
    acceptance_criteria:
      - "Shift+Click any data-object-id element copies its ID (dev mode)"
      - "No console errors on load or through the full create → password-reveal → edit → regenerate → delete/archive path"
    placeholder_message: "🚧 Final polish..."

# ============================================================================
# JAVASCRIPT REQUIREMENTS
# ============================================================================

javascript_functions:
  initialization:
    - "renderEmployees() - filters, paginates, and renders both Table and Card views from window.DEMO_DATA.employees"
    - "updateFilterOptions() - derives Department/Position dropdown options from current data"

  form_handling:
    - "submitCreateEmployee() - validates required fields + duplicate ID/Email, creates record, generates password, opens Password Reveal"
    - "saveEditEmployee() - updates the in-memory record"

  ui_interactions:
    - "setView(view) - toggles Table/Card, preserves filters/search/page"
    - "goPage(p) - pagination"
    - "openCreateEmployeeModal() / openEditEmployeeModal(id) / openRegenPasswordModal(id) / openDeleteEmployeeModal(id) / closeModal(id)"

  api_calls:
    - "None — this prototype is demo-data-only, matching 04.1's precedent (no PrototypeAPI wiring for this scenario)"

  feedback:
    - "showToast(message)"
    - "copyPassword()"

