  components_available:
    - "dev-mode-toggle (components/dev-mode.js + dev-mode.css)"

# ============================================================================
# PAGE REQUIREMENTS (from specification)
# ============================================================================

page_purpose: |
  Rita sees the current Employee roster and onboards a new hire — creating
  their Employee record and getting them a working login — in about two
  minutes, without it becoming a second system she has to maintain.

user_context:
  - "Rita is already authenticated (HR role) and on the Dashboard"
  - "A new hire (Taylor Brooks) starts Monday and isn't in the system yet"
  - "The existing roster (Casey/Morgan/Jordan/Sam) is the canon demo data already used across every other prototype in this project"

success_criteria:
  - "Rita can create a new Employee with only 3 required fields (ID/Code, Name, Email)"
  - "A system-generated password is shown exactly once, never re-displayable after Done"
  - "Edit, Regenerate Password, and Delete/Archive are all reachable from the roster, with Delete/Archive branching copy based on whether the Employee has assignment history"
  - "The new left-pane nav (Dashboard/Skills/Employees) collapses sensibly below 768px"

# ============================================================================
# DEMO DATA REQUIREMENTS
# ============================================================================

demo_data_needed:
  current_user:
    firstName: "Rita"
    lastName: "the Referee"
    email: "rita@sailssoftware.com"
    role: "HR"

  employees_preseeded: "Casey the Continuer, Morgan, Jordan, Sam — see data/demo-data.js"

  example_submission:
    employeeCode: "EMP-1005"
    firstName: "Taylor"
    lastName: "Brooks"
    email: "taylor.brooks@sailssoftware.com"
    position: "Software Engineer"
    department: "Engineering"

