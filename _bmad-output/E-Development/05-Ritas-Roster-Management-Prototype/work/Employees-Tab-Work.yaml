  colors:
    primary: "#1d4ed8"
    primary_hover: "#1e40af"
    success: "#2b8a3e"
    error: "#c92a2a"

  tailwind_config:
    theme_extend:
      colors:
        "talentpilot":
          50: "#eff6ff"
          100: "#dbeafe"
          500: "#2563eb"
          600: "#1d4ed8"
          700: "#1e40af"
