<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Discovery - TalentPilot-AI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        talentpilot: { 50: '#eff6ff', 100: '#dbeafe', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 font-sans">

    <!-- ========================================================================
         HEADER (both modes; nav active-state and Continue Watching visibility
         differ by mode — re-rendered by renderHeader())
         ======================================================================== -->
    <header id="cd-header" class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
        <div class="flex items-center gap-8">
            <span id="cd-logo" class="font-bold text-lg text-gray-900">TalentPilot-AI</span>
            <nav id="cd-nav" class="flex gap-6 text-sm"></nav>
        </div>
        <div class="relative">
            <button id="cd-user-menu-trigger" onclick="toggleUserMenu()"
                    class="flex items-center gap-2 text-sm text-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-talentpilot-500 rounded-lg">
                <span id="cd-user-avatar" class="w-8 h-8 rounded-full bg-talentpilot-100 flex items-center justify-center text-talentpilot-700 font-medium">&nbsp;</span>
                <span id="cd-user-name">&nbsp;</span>
            </button>
            <div id="cd-user-menu-dropdown" style="display: none"
                 class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg z-10">
                <button id="cd-user-menu-signout" onclick="handleSignOut()"
                        class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg">
                    Sign Out
                </button>
            </div>
        </div>
    </header>

    <!-- ========================================================================
         MAIN — content swapped between Mode A (grid) and Mode B (video) by
         renderMain(), matching real ContentDiscovery.tsx's single-page swap
         (no route change).
         ======================================================================== -->
    <main id="cd-main" class="px-6 py-6 max-w-5xl mx-auto"></main>

    <!-- ========================================================================
         JAVASCRIPT - Shared Scripts
         ======================================================================== -->
    <script src="shared/init.js"></script>

    <!-- ========================================================================
         JAVASCRIPT - Page-Specific Script
         ======================================================================== -->
    <script>
        /**
         * Page: Employee Content Discovery
         * Two modes on one page: 'grid' (default) and 'video' (inline playback)
         */

        let myAssignments = [];
        let currentUser = null;
        let mode = 'grid'; // 'grid' | 'video'
        let playingItem = null;

        window.initPage = function () {
            console.log('📄 Content Discovery loaded');
            currentUser = window.DEMO_DATA && window.DEMO_DATA.currentUser;
            if (!currentUser) {
                console.error('❌ No currentUser in demo data');
                return;
            }
            const initial = currentUser.name.charAt(0).toUpperCase();
            document.getElementById('cd-user-avatar').textContent = initial;
            document.getElementById('cd-user-name').textContent = currentUser.name.split(' ')[0];

            myAssignments = (window.DEMO_DATA.myAssignments || []).slice();
            console.log(`📋 Loaded ${myAssignments.length} sample assignments for ${currentUser.name}`);

            renderHeader();
            renderMain();
        };

        function toggleUserMenu() {
            const dropdown = document.getElementById('cd-user-menu-dropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        document.addEventListener('click', (event) => {
            const trigger = document.getElementById('cd-user-menu-trigger');
            const dropdown = document.getElementById('cd-user-menu-dropdown');
            if (dropdown.style.display !== 'none' && !trigger.contains(event.target) && !dropdown.contains(event.target)) {
                dropdown.style.display = 'none';
            }
        });

        function handleSignOut() {
            console.log('[prototype] Sign out clicked — would clear session and redirect to /login');
            document.getElementById('cd-user-menu-dropdown').style.display = 'none';
        }

        // ================================================================
        // HEADER (nav differs by mode, matching real ContentDiscovery.tsx)
        // ================================================================
        function renderHeader() {
            const nav = document.getElementById('cd-nav');
            if (mode === 'video') {
                nav.innerHTML = `
                    <button id="cd-nav-assignments" onclick="closeVideo()"
                            class="text-gray-600 hover:text-gray-900 pb-3 -mb-3 transition-colors">Assignments</button>
                    <span id="cd-nav-continue-watching" class="text-talentpilot-600 font-medium border-b-2 border-talentpilot-600 pb-3 -mb-3">Continue Watching</span>`;
            } else {
                nav.innerHTML = `
                    <span id="cd-nav-assignments" class="text-talentpilot-600 font-medium">Assignments</span>
                    <span id="cd-nav-continue-watching" class="text-gray-400">Continue Watching</span>`;
            }
        }

        // ================================================================
        // MODE SWITCH
        // ================================================================
        function renderMain() {
            const main = document.getElementById('cd-main');
            main.className = mode === 'video' ? 'px-6 py-6 max-w-5xl mx-auto' : 'px-6 py-6 max-w-5xl mx-auto';
            main.innerHTML = mode === 'video' ? renderVideoModeHtml() : renderGridModeHtml();
            if (mode === 'video') attachVideoIframe();
        }

        function openVideo(assignmentId) {
            const item = myAssignments.find((a) => a.assignment_id === assignmentId);
            if (!item || !item.content) return;
            playingItem = item;
            mode = 'video';
            renderHeader();
            renderMain();
        }

        function closeVideo() {
            playingItem = null;
            mode = 'grid';
            renderHeader();
            renderMain();
        }

        // ================================================================
        // MODE A: ASSIGNMENT GRID
        // ================================================================
        function statusPillHtml(status) {
            const config = {
                NOT_STARTED: { icon: '⊕', label: 'To Start', cls: 'bg-gray-100 text-gray-800' },
                IN_PROGRESS: { icon: '⟳', label: 'In Progress', cls: 'bg-talentpilot-100 text-talentpilot-800' },
                COMPLETED: { icon: '✓', label: 'Completed', cls: 'bg-green-100 text-green-800' },
            }[status];
            return `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold ${config.cls}"><span aria-hidden="true">${config.icon}</span>${config.label}</span>`;
        }

        function cardHtml(item) {
            const c = item.content;
            const durationLabel = c && c.metadata ? formatIsoDuration(c.metadata.duration) : '';
            const thumb = c && c.metadata && c.metadata.video_id ? `https://img.youtube.com/vi/${c.metadata.video_id}/hqdefault.jpg` : null;

            let progressHtml;
            if (item.status === 'COMPLETED') {
                progressHtml = `
                    <div class="pt-2 border-t border-gray-100">
                        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-green-500" style="width: 100%"></div></div>
                        <p class="text-xs text-gray-600 font-medium mt-1">100% watched</p>
                    </div>`;
            } else if (item.watch_position > 0 && item.status_percentage !== null) {
                const pct = Math.max(item.status_percentage, 4);
                progressHtml = `
                    <div class="pt-2 border-t border-gray-100">
                        <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-talentpilot-500" style="width: ${pct}%"></div></div>
                        <p class="text-xs text-gray-600 font-medium mt-1">${item.status_percentage}% watched</p>
                    </div>`;
            } else {
                progressHtml = `<p class="text-xs text-gray-500 pt-2 border-t border-gray-100">Not started yet</p>`;
            }

            return `
                <div role="button" tabindex="0" aria-label="${item.skill_name}, ${item.status === 'NOT_STARTED' ? 'to start' : item.status === 'IN_PROGRESS' ? 'in progress' : 'completed'}"
                     class="flex flex-col gap-2 p-5 bg-white rounded-lg border border-gray-200 cursor-pointer hover:shadow-md hover:border-talentpilot-400 transition-all"
                     onclick="openVideo('${item.assignment_id}')"
                     onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openVideo('${item.assignment_id}'); }">
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="font-semibold text-gray-900">${item.skill_name}</h3>
                        ${statusPillHtml(item.status)}
                    </div>
                    ${c ? `
                        ${thumb ? `<img src="${thumb}" alt="${c.title}${durationLabel ? ' - ' + durationLabel : ''}" class="w-full h-24 object-cover rounded-md">` :
                                   `<div role="img" aria-label="${c.title}" class="w-full h-24 bg-gray-100 rounded-md flex items-center justify-center text-gray-400 text-xs">No preview available</div>`}
                        <p class="text-sm text-gray-600">${c.title}</p>
                        <div class="flex items-center gap-2 text-xs text-gray-500 flex-wrap">
                            <span class="font-medium">${c.source}</span>
                            ${durationLabel ? `<span>·</span><span>${durationLabel}</span>` : ''}
                        </div>
                        <div class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800 w-fit">✓ Approved</div>
                        ${progressHtml}
                    ` : `<div class="text-sm text-gray-500">No recommended content yet for this skill.</div>`}
                </div>`;
        }

        function cardGroupHtml(title, items) {
            if (items.length === 0) return '';
            return `
                <section class="mb-8">
                    <h2 class="text-lg font-bold text-gray-900 mb-4">${title} <span class="text-sm text-gray-500">(${items.length})</span></h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${items.map(cardHtml).join('')}
                    </div>
                </section>`;
        }

        function renderGridModeHtml() {
            const total = myAssignments.length;
            const inProgress = myAssignments.filter((a) => a.group === 'IN_PROGRESS');
            const toStart = myAssignments.filter((a) => a.group === 'TO_START');
            const completed = myAssignments.filter((a) => a.group === 'COMPLETED');

            if (total === 0) {
                return `
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-gray-900">Assigned Skills</h1>
                        <p class="text-sm text-gray-600 mt-2">Select a video to continue watching or start a new one</p>
                    </div>
                    <div class="text-center py-12 border-2 border-dashed border-gray-200 rounded-lg">
                        <p class="text-gray-500">Nothing in progress right now.</p>
                        <p class="text-sm text-gray-400 mt-1">View your assignments once one is assigned.</p>
                    </div>`;
            }

            return `
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">Assigned Skills</h1>
                    <p class="text-sm text-gray-600 mt-2">Select a video to continue watching or start a new one</p>

                    <div class="bg-gradient-to-r from-blue-50 to-blue-50 rounded-lg px-5 py-4 border border-blue-200 mt-6">
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div><p class="text-xs text-gray-600 uppercase tracking-wide mb-1">Name</p><p id="cd-info-name" class="text-sm font-semibold text-gray-900">${currentUser.name}</p></div>
                            <div><p class="text-xs text-gray-600 uppercase tracking-wide mb-1">Role</p><p class="text-sm font-semibold text-gray-900">Individual Contributor</p></div>
                            <div><p class="text-xs text-gray-600 uppercase tracking-wide mb-1">Email</p><p id="cd-info-email" class="text-sm font-semibold text-gray-900">${currentUser.email}</p></div>
                            <div><p class="text-xs text-gray-600 uppercase tracking-wide mb-1">Skills Assigned</p><p id="cd-info-skills" class="text-sm font-semibold text-talentpilot-600">${total}</p></div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-4 mb-6">
                    <div class="bg-white rounded-lg p-4 border border-gray-200"><p class="text-xs text-gray-500 uppercase tracking-wide mb-1 font-medium">Total</p><p id="cd-stat-total" class="text-3xl font-bold text-gray-900">${total}</p></div>
                    <div class="bg-white rounded-lg p-4 border border-gray-200"><p class="text-xs text-gray-500 uppercase tracking-wide mb-1 font-medium">In Progress</p><p id="cd-stat-inprogress" class="text-3xl font-bold text-talentpilot-600">${inProgress.length}</p></div>
                    <div class="bg-white rounded-lg p-4 border border-gray-200"><p class="text-xs text-gray-500 uppercase tracking-wide mb-1 font-medium">To Start</p><p id="cd-stat-tostart" class="text-3xl font-bold text-gray-600">${toStart.length}</p></div>
                    <div class="bg-white rounded-lg p-4 border border-gray-200"><p class="text-xs text-gray-500 uppercase tracking-wide mb-1 font-medium">Completed</p><p id="cd-stat-completed" class="text-3xl font-bold text-green-600">${completed.length}</p></div>
                </div>

                ${cardGroupHtml('In Progress', inProgress)}
                ${cardGroupHtml('To Start', toStart)}
                ${cardGroupHtml('Completed', completed)}`;
        }

        // ================================================================
        // MODE B: INLINE VIDEO VIEW — real YouTube iframe embed, resuming
        // at watch_position. NOT the full custom capture-service/YT.Player
        // API integration from the real VideoPlayer.tsx (no backend to post
        // progress to in a static prototype) — see stories/ note.
        // ================================================================
        function renderVideoModeHtml() {
            const item = playingItem;
            const title = (item.content && item.content.title) || item.skill_name;
            return `
                <button onclick="closeVideo()" class="mb-4 text-talentpilot-600 hover:text-talentpilot-800 text-sm font-medium">← Back to Assignments</button>
                <div class="mx-auto max-w-3xl">
                    <h1 id="cd-video-title" class="text-2xl font-bold text-gray-900 mb-4">${title}</h1>
                    <div id="cd-video-container" style="aspect-ratio: 16/9;" class="w-full bg-black rounded-lg overflow-hidden"></div>
                    <p class="mt-2 text-sm text-gray-500">Resuming at ${formatTime(item.watch_position)}</p>
                </div>`;
        }

        function attachVideoIframe() {
            const item = playingItem;
            const container = document.getElementById('cd-video-container');
            if (!container || !item.content || !item.content.metadata) return;
            const videoId = item.content.metadata.video_id;
            const start = Math.floor(item.watch_position || 0);
            const iframe = document.createElement('iframe');
            iframe.id = 'cd-video-iframe';
            iframe.className = 'w-full h-full';
            iframe.src = `https://www.youtube.com/embed/${videoId}?start=${start}&rel=0&modestbranding=1`;
            iframe.title = item.content.title;
            iframe.frameBorder = '0';
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            container.appendChild(iframe);
        }

        function formatTime(seconds) {
            const s = Math.max(0, Math.floor(seconds || 0));
            const m = Math.floor(s / 60);
            const rem = s % 60;
            return `${m}:${rem.toString().padStart(2, '0')}`;
        }

        function formatIsoDuration(iso) {
            const match = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(iso || '');
            if (!match) return '';
            const hours = parseInt(match[1] || '0', 10);
            const minutes = parseInt(match[2] || '0', 10);
            const totalMinutes = hours * 60 + minutes;
            return totalMinutes > 0 ? `${totalMinutes} min` : '';
        }
    </script>
</body>
</html>
