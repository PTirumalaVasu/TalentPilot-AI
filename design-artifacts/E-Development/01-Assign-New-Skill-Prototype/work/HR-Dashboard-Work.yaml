  - id: "section-3"
    name: "Loading / Empty / Error States"
    status: "complete"
    completed_date: "2026-09-03"
    actual_time: "~15 minutes + 2 issue-fix rounds"
    issues_encountered: "User reported 'sample data not showing' twice — resolved by adding sampleAssignments to demo-data.json, then superseded by an accelerated Section 4+5 build (real accordion+table) per user's reference screenshot"
    improvements_made: "None beyond the issue fixes"
    scope: "Skeleton loading rows, empty-grid message, error message + Retry — the three non-happy-path renders of the main content area"
    files_affected: ["hr-dashboard.html", "data/demo-data.json"]
    dependencies: ["section-2"]
    object_ids:
      - "hr-dashboard-loading"
      - "hr-dashboard-empty"
      - "hr-dashboard-error"
      - "hr-dashboard-error-retry"
    tailwind_classes:
      - "Skeleton: animate-pulse, bg-gray-100, rounded"
      - "Empty/Error box: text-center, py-12, border-2, border-dashed, rounded-lg"
    acceptance_criteria:
      - "Empty state is the true default (no seeded assignments) — verify it renders correctly, not just as an edge case"
      - "Error state shows Retry, which re-triggers the loading state"
    placeholder_message: "🚧 Building state handling..."

  - id: "section-4"
    name: "Assignment Grid — Accordion Structure"
    status: "complete-pending-approval"
    completed_date: "2026-09-03"
    actual_time: "built together with section-5, in response to user's reference screenshot"
    issues_encountered: "None — built ahead of schedule per explicit user direction, see story file process note"
    improvements_made: "None"
    scope: "Employee-grouped accordion shell: group header (name + skill count + chevron), expand/collapse behavior, alphabetical sort"
