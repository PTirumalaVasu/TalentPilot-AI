    status: "complete-pending-approval"
    completed_date: "2026-09-03"
    actual_time: "built together with section-4, in response to user's reference screenshot"
    issues_encountered: "None — View Details deliberately left as console placeholder (drill-down modal out of scenario scope); Delete works locally but has no toast yet (Section 7)"
    improvements_made: "None"
    scope: "Per-row table: skill name, status pill (never color-only), progress bar, last-updated + staleness flag, View Details link, delete icon button"
