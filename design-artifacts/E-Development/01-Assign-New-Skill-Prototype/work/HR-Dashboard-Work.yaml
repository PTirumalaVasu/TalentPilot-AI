      - "Live region: sr-only"
    acceptance_criteria:
      - "Toast appears on assignment-created (once View 2 exists) and delete, auto-dismisses after 4s"
      - "aria-live region present even though it has no visible content"
    placeholder_message: "🚧 Wiring up toast + live announcements..."

# ============================================================================
# JAVASCRIPT REQUIREMENTS
# ============================================================================

javascript_functions:
  initialization:
    - "initPage() — loads demo-data.json via shared/init.js, renders initial (empty) grid"

  state_handling:
    - "renderLoading() / renderEmpty() / renderError() / renderGrid(assignments)"
    - "handleRetry() — re-triggers the loading→loaded/error cycle"

  ui_interactions:
    - "toggleUserMenu()"
    - "toggleEmployeeGroup(employeeId)"
    - "handleSignOut() — clears session storage, redirects to a placeholder login state"
    - "handleDeleteRow(assignmentId) — removes row from in-memory state, shows toast"

  feedback:
    - "showToast(message)"
    - "announceLive(message) — writes to the aria-live region"

# ============================================================================
# NAVIGATION
# ============================================================================

navigation:
  previous_page: "none (scenario entry point)"
  next_page_success: "Assign New Skill Modal (View 2, same page — overlay, not a route change)"
  next_page_cancel: "n/a"

# ============================================================================
# TESTING CHECKLIST
# ============================================================================

testing_checklist:
  functionality:
    - "[ ] Empty state renders correctly on first load (true default, not just an edge case)"
    - "[ ] + New Assignment button present and clickable"
    - "[ ] Accordion groups expand/collapse independently"
    - "[ ] Status pills never rely on color alone"
    - "[ ] Staleness flag shows explicit day-count text"
    - "[ ] Pagination disables correctly at first/last page"
    - "[ ] Toast auto-dismisses after 4s"

  responsive_testing:
    - "[ ] 390px (mobile) — no horizontal scroll, tap targets usable"
    - "[ ] 768px (tablet) — breakpoint transition looks correct"
    - "[ ] 1440px (desktop) — matches primary viewport intent"

  code_quality:
    - "[ ] All Object IDs present"
    - "[ ] No console errors"
    - "[ ] Tailwind classes match design-system.md tokens (talentpilot-*, not blue-*)"

  accessibility:
    - "[ ] Keyboard navigation works through header, toolbar, rows, pagination"
    - "[ ] aria-live region present and updates on row changes"
    - "[ ] Focus states visible (focus-visible:ring-2 ring-talentpilot-500)"

