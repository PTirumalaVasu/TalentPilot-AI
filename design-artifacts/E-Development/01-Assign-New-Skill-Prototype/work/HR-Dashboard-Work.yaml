    acceptance_criteria:
      - "Previous disabled on page 1, Next disabled on last page"
      - "Footer caption renders at the bottom of the page"
    placeholder_message: "🚧 Adding pagination..."

  - id: "section-7"
    name: "Toast & Live Announcements"
    status: "complete-pending-approval"
    completed_date: "2026-09-03"
    actual_time: "pulled forward after Delete/View Details were reported as feeling non-functional"
    issues_encountered: "Delete and View Details were both silent (console-log only or a barely-visible count update) — this section's toast directly resolves both"
    improvements_made: "None"
    scope: "Bottom-center success toast (auto-dismiss 4s) and hidden aria-live region announcing changes — cross-cutting, wired last so it can be triggered from any prior section's actions"
    files_affected: ["hr-dashboard.html"]
    dependencies: ["section-6"]
    object_ids:
