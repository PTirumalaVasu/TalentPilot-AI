    acceptance_criteria:
      - "Status pill always includes text label, not color alone"
      - "Staleness (Needs Attention) shows both red styling AND explicit day-count text"
      - "View Details and delete icon are keyboard-reachable and labeled"
    placeholder_message: "🚧 Building assignment rows..."

  - id: "section-6"
    name: "Pagination & Footer"
    status: "complete-pending-approval"
    completed_date: "2026-09-03"
    actual_time: "pulled forward, built alongside the Section 2 button-placement fix"
    issues_encountered: "User flagged pagination as missing right after the Section 4-5 review — pulled forward out of the original sequence"
    improvements_made: "None"
    scope: "Previous/current-page/Next controls, 'App v0.1.0' footer caption"
    files_affected: ["hr-dashboard.html"]
    dependencies: ["section-5"]
    object_ids:
      - "hr-dashboard-page-prev"
      - "hr-dashboard-page-current"
      - "hr-dashboard-page-next"
