# ============================================================================
# PROTOTYPE WORK FILE: View 1 — HR Dashboard (Grid)
# ============================================================================
# Purpose: Complete planning document for section-by-section implementation
# Created: 2026-09-03
# Sources:
#   - _bmad-output/planning-artifacts/specs/page-hr-dashboard.md
#   - _bmad-output/planning-artifacts/design-system.md
#   - Logical-View-Map.md (this folder)
#   - Verified against frontend/src/features/dashboard/DashboardPage.tsx and
#     frontend/src/pages/hr/Dashboard.tsx (real source, not guessed)
# ============================================================================

metadata:
  view_name: "HR Dashboard (Grid)"
  scenario: "01-Assign-New-Skill"
  complexity: "medium"
  estimated_sections: 7
  estimated_time: "115 minutes"

  device_compatibility:
    type: "responsive"
    primary_viewport: "1440px"
    test_viewports:
      - width: 390
        height: 844
        device: "Mobile (390px)"
      - width: 768
        height: 1024
        device: "Tablet (768px)"
      - width: 1440
        height: 900
        device: "Desktop (1440px)"
    breakpoints: [768, 1024, 1280]
    touch_optimized: true
    hover_interactions: true

  dependencies:
    - "shared/prototype-api.js"
    - "shared/init.js"
    - "data/demo-data.json"

# ============================================================================
# DESIGN TOKENS (from _bmad-output/planning-artifacts/design-system.md)
# ============================================================================

design_tokens:
  colors:
    primary: "#1d4ed8"       # talentpilot-600
    primary_hover: "#1e40af" # talentpilot-700
    success: "#16a34a"       # green-600 (Completed states)
    error: "#dc2626"         # red-600 (delete, errors)
    warning: "#b45309"       # amber-700 (Needs Attention text)

  tailwind_config:
    theme_extend:
      colors:
        talentpilot:
          50: "#eff6ff"
          100: "#dbeafe"
          500: "#2563eb"
          600: "#1d4ed8"
          700: "#1e40af"
      fontFamily:
        sans: "['Inter', 'system-ui', 'sans-serif']"

  components_available:
    - "toast (components/toast.js) — bottom-center, role=status aria-live=polite, 4s auto-dismiss"
    - "status-badge (inline pattern per design-system.md — never color-only)"

  design_system_note: >
    Standardizing on talentpilot-* for every brand-blue use in this prototype
    (buttons, active nav, links) rather than mixing in Tailwind's default
    blue-* the way production does — see design-system.md Notes #1.

# ============================================================================
# VIEW REQUIREMENTS (from specification)
# ============================================================================

page_purpose: |
  Let HR Admin Rita browse all skill assignments grouped by employee, see
  status/progress/staleness at a glance, and launch the Assign New Skill
  modal (View 2, built separately) via "+ New Assignment". This is the
  scenario's entry point and the page the user lands back on after a
  successful assignment.

user_context:
  - "User has just signed in as HR_ADMIN (Rita the Recommender) and landed on /hr/dashboard"
  - "Real seed data (data/demo-data.json) provides 4 real employees + 5 real skills, but no seeded Assignments — the prototype's own in-session state is the source of dashboard rows"
  - "User's current state: browsing the grid, about to click + New Assignment (hands off to View 2)"

success_criteria:
  - "All 4 employees' assignments (once created via View 2) render grouped and expandable"
  - "Status/progress/staleness always shown with text, never color-only (design-system.md pattern)"
  - "+ New Assignment button is present and wired to open View 2 once it exists"
  - "Toast + refreshed grid appear after an assignment is created in View 2"

# ============================================================================
# DEMO DATA REQUIREMENTS
# ============================================================================

demo_data_needed:
  current_user:
    name: "Rita the Recommender"
    email: "rita@sails.example.com"
    role: "HR_ADMIN"
  source: "design-artifacts/E-Development/01-Assign-New-Skill-Prototype/data/demo-data.json (real seed data, see file header)"
  note: >
    No Assignments are seeded (real backend doesn't seed them either) — the
    grid starts empty until the user creates one via View 2. Empty state
    must therefore be the true default render, not a rare edge case.

# ============================================================================
# OBJECT ID MAP
# ============================================================================

object_ids:
  header:
    - "hr-dashboard-logo"
    - "hr-dashboard-nav-dashboard"
    - "hr-dashboard-nav-skills"
    - "hr-dashboard-user-menu-trigger"
    - "hr-dashboard-user-menu-signout"

  toolbar:
    - "hr-dashboard-new-assignment-button"
    - "hr-dashboard-title"
    - "hr-dashboard-total-count"

  states:
    - "hr-dashboard-loading"
    - "hr-dashboard-empty"
    - "hr-dashboard-error"
    - "hr-dashboard-error-retry"

  grid:
    - "hr-dashboard-employee-group-{employeeId}"
    - "hr-dashboard-employee-chevron-{employeeId}"
    - "hr-dashboard-row-{assignmentId}"
    - "hr-dashboard-row-status-{assignmentId}"
    - "hr-dashboard-row-progress-{assignmentId}"
    - "hr-dashboard-row-lastupdated-{assignmentId}"
    - "hr-dashboard-row-viewdetails-{assignmentId}"
    - "hr-dashboard-row-delete-{assignmentId}"

  pagination:
    - "hr-dashboard-page-prev"
    - "hr-dashboard-page-current"
    - "hr-dashboard-page-next"

  feedback:
    - "hr-dashboard-toast"
    - "hr-dashboard-live-region"

# ============================================================================
# SECTION BREAKDOWN (implementation order — user-approved 2026-09-03)
# ============================================================================

